syntax ="proto3";

package raftKVRpcProtoc;
option cc_generic_services=true;

//日志实体
message GetArgs{
    bytes Key=1;
    bytes ClientId=2;
    int32 RequestId=3;
}

message GetReply{
    bytes Err=1;
    bytes Value=2;
}

message PutAppendArgs{
    bytes Key=1;
    bytes Value=2;
    bytes Op=3;

    bytes ClientId=4;
    int32 RequestId=5;
}

message PutAppendReply{
    bytes Err=1;
}

//只有Raft节点之间才会涉及RPC通信
service kvServerRpc{
    rpc Get(GetArgs) returns (GetReply);
    rpc PutAppend(PutAppendArgs) returns (PutAppendReply);
}