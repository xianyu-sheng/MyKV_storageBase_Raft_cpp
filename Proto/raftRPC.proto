//代码理解：https://www.doubao.com/thread/we5d69c32157b2e66
syntax="proto3";

package raftRpcProtoc;//所在的命名空间

option cc_generic_services = true;//生成服务端和客户端代码，开启stub服务

//日志实体
message LogEntry{
    bytes Command =1;
    int32 LogTerm=2;
    int32 LogIndex=3;
}

//AppendEntries由Leader复制log项目，也可以当做是心跳链接，注释中的rf为Leader节点
message AppendEntriesArgs{
    int32 Term=1;
    int32 LeaderId=2;
    int32 PrevLogIndex=3;
    int32 PrevLogTerm=4;
    repeated LogEntry Entries=5;
    int32 LeaderCommit=6;
}

message AppendEntriesReply{
    int32 Term=1;
    bool Success=2;
    int32 UpdateNextIndex=3;
    int32 AppState=4;
}
message RequestVoteArgs{
    int32 Term=1;
    int32 CandidateId=2;
    int32 LastLogIndex=3;
    int32 LastLogTerm=4;
}

message RequestVoteReply{
    int32 Term=1;
    bool VoteGranted=2;
    int32 VoteState =3;
}
message PreRequestVoteArgs{
    int32 Term=1;
    int32 CandidateId=2;
    int32 LastLogIndex=3;
    int32 LastLogTerm=4;
}
message PreRequestVoteReply{
    int32 Term=1;
    bool VoteGranted=2;
}
message InstallSnapshotRequest{
    int32 LeaderId=1;
    int32 Term=2;
    int32 LastSnapShotIncludeIndex=3;
    int32 LastSnapShotIncludeTerm=4;
    bytes SnapshotData=5;//快照信息
}

//InstallSnapshotResponse 只用返回term 因为对于快照只要Term是符合的 就是无条件接受的
message InstallSnapshotResponse{
    int32 Term=1;
}
//只有Raft节点之间才会涉及RPC通信
service raftRpc{
    rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
    rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
    rpc PreRequestVote(PreRequestVoteArgs) returns (PreRequestVoteReply); // 新增预选举 RPC
}

